    <script>
      // Filter benign MediaPipe / TensorFlow Lite WASM C++ diagnostic logs from triggering false-alarm red errors in DevTools
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          const first = typeof args[0] === "string" ? args[0] : "";
          if (
            first.includes("INFO: Created TensorFlow Lite") ||
            first.includes("face_landmarker_graph.cc") ||
            first.includes("gl_context.cc") ||
            first.includes("Sets FaceBlendshapesGraph acceleration")
          ) {
            console.debug(...args);
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
